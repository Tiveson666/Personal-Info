services:
  web:
    build:
      command: composer install && npm install && npm run build
    start: php artisan serve --host=0.0.0.0 --port=8000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: error

databases:
  postgres:
    plan: free
